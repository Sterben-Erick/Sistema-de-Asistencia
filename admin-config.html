        const estadoNombre = document.getElementById("estadoNombreInstitucion");

  function actualizarEstadosConfiguracion() {
    const estados = [
      ["configPermitirManual", "estadoPermitirManual"],
      ["configPermitirScanner", "estadoPermitirScanner"],
      ["configBloquearDuplicado", "estadoBloquearDuplicado"],
      ["configEntradaPrevia", "estadoEntradaPrevia"],
      ["configBloquearSalidaInactivo", "estadoBloquearSalidaInactivo"],
      ["configEntradaInactivo", "estadoEntradaInactivo"],
      ["configMostrarFoto", "estadoMostrarFoto"],
      ["configMostrarQR", "estadoMostrarQR"]
    ];

    estados.forEach(([idInput, idEstado]) => {
      const input = document.getElementById(idInput);
      const estado = document.getElementById(idEstado);

      if (!input || !estado) return;

      estado.textContent = input.checked ? "ACTIVADO" : "DESACTIVADO";
      estado.classList.toggle("activo", input.checked);

      input.addEventListener("change", () => {
        estado.textContent = input.checked ? "ACTIVADO" : "DESACTIVADO";
        estado.classList.toggle("activo", input.checked);
      });
    });
  }

  function pintarEstadoCierre_() {
    google.script.run.withSuccessHandler(r => {
      const act = document.getElementById("btnActivarCierre");
      const des = document.getElementById("btnDesactivarCierre");
      if (!act || !des) return;
      const n = (r && r.estado === "OK") ? r.activos : 0;
      act.style.background = n > 0 ? "#16834b" : "";
      act.style.color = n > 0 ? "#fff" : "";
      des.style.background = n > 0 ? "" : "#c62828";
      des.style.color = n > 0 ? "" : "#fff";
    }).obtenerEstadoTriggerCierre();
  }

  function cargarVistaPreviaRecursos() {
    google.script.run
      .withSuccessHandler(resultado => {
        if (!resultado || resultado.estado !== "OK") return;

        const logo = document.getElementById("vistaLogoActual");
        const fondo = document.getElementById("vistaFondoActual");
        const logoSinConfigurar = document.getElementById("logoSinConfigurar");
        const fondoSinConfigurar = document.getElementById("fondoSinConfigurar");
        const estadoLogo = document.getElementById("estadoLogoInstitucional");
        const estadoFondo = document.getElementById("estadoImagenFondo");
        const textoLogo = document.getElementById("textoLogoActual");
        const textoFondo = document.getElementById("textoFondoActual");

        if (resultado.logoInstitucional) {
          logo.src = resultado.logoInstitucional;
          logo.style.display = "block";
          logoSinConfigurar.style.display = "none";
          estadoLogo.textContent = "EN USO";
          estadoLogo.classList.add("activo");
          textoLogo.textContent = "Este es el logo utilizado actualmente.";
        } else {
          logo.style.display = "none";
          logoSinConfigurar.style.display = "flex";
          estadoLogo.textContent = "SIN CONFIGURAR";
          estadoLogo.classList.remove("activo");
          textoLogo.textContent = "No hay un logo en uso.";
        }

        if (resultado.imagenFondoAsistencia) {
          fondo.src = resultado.imagenFondoAsistencia;
          fondo.style.display = "block";
          fondoSinConfigurar.style.display = "none";
          estadoFondo.textContent = "EN USO";
          estadoFondo.classList.add("activo");
          textoFondo.textContent = "Esta es la imagen utilizada actualmente.";
        } else {
          fondo.style.display = "none";
          fondoSinConfigurar.style.display = "flex";
          estadoFondo.textContent = "SIN CONFIGURAR";
          estadoFondo.classList.remove("activo");
          textoFondo.textContent = "No hay una imagen en uso.";
        }
      })
      .withFailureHandler(error => {
        console.error(error);
      })
      .obtenerRecursosPublicos();
  }

  function configurarPrevisualizacionRecursos() {
    const inputLogo = document.getElementById("configLogoInstitucional");
    const inputFondo = document.getElementById("configImagenFondo");

    inputLogo.addEventListener("change", () => {
      mostrarPrevisualizacionRecurso(
        inputLogo,
        "vistaNuevoLogo",
        "nombreNuevoLogo",
        "nuevoLogoContenedor"
      );
    });

    inputFondo.addEventListener("change", () => {
      mostrarPrevisualizacionRecurso(
        inputFondo,
        "vistaNuevoFondo",
        "nombreNuevoFondo",
        "nuevoFondoContenedor"
      );
    });
  }

  function mostrarPrevisualizacionRecurso(input, idImagen, idNombre, idContenedor) {
    if (!input.files || !input.files[0]) return;

    const archivo = input.files[0];

    if (!["image/jpeg", "image/png", "image/webp"].includes(archivo.type)) {
      input.value = "";
      mostrarNotificacion(
        "Solo se permiten imágenes JPG, PNG o WEBP.",
        "error"
      );
      return;
    }

    if (archivo.size > 5 * 1024 * 1024) {
      input.value = "";
      mostrarNotificacion(
        "La imagen no puede superar los 5 MB.",
        "error"
      );
      return;
    }

    const lector = new FileReader();

    lector.onload = () => {
      document.getElementById(idImagen).src = lector.result;
      document.getElementById(idNombre).textContent = archivo.name;
      document.getElementById(idContenedor).classList.add("visible");
    };

    lector.readAsDataURL(archivo);
  }

  document.addEventListener("click", e => {
    if (e.target.closest("#btnGuardarConfiguracion")) {
      guardarConfiguracion();
    }
    if (e.target.closest("#btnActivarCierre")) {
      const btn = document.getElementById("btnActivarCierre");
      cambiarEstadoBoton(btn, true, "hourglass_top", "Activando...");
      google.script.run
        .withSuccessHandler(r => {
          cambiarEstadoBoton(btn, false, "schedule", "Activar");
          mostrarNotificacion(r && r.mensaje ? r.mensaje : "Cierre activado.", "exito");
          pintarEstadoCierre_();
        })
        .withFailureHandler(err => {
          console.error(err);
          cambiarEstadoBoton(btn, false, "schedule", "Activar");
          mostrarNotificacion("No se pudo activar el cierre.", "error");
        })
        .crearTriggerCierreAsistencia();
    }
    if (e.target.closest("#btnDesactivarCierre")) {
      const btn = document.getElementById("btnDesactivarCierre");
      cambiarEstadoBoton(btn, true, "hourglass_top", "Desactivando...");
      google.script.run

          cambiarEstadoBoton(btn, false, "schedule", "Desactivar");
          mostrarNotificacion(r && r.mensaje ? r.mensaje : "Cierre desactivado.", "exito");
          pintarEstadoCierre_();
        })
        .withFailureHandler(err => {
          console.error(err);
          cambiarEstadoBoton(btn, false, "schedule", "Desactivar");
          mostrarNotificacion("No se pudo desactivar el cierre.", "error");
        })
        .eliminarTriggerCierreAsistencia();
    }
  });

  function guardarConfiguracion() {
    const token = obtenerToken();
    const btn = document.getElementById("btnGuardarConfiguracion");
    const inputLogo = document.getElementById("configLogoInstitucional");
    const inputFondo = document.getElementById("configImagenFondo");
    const tiempo = Number(document.getElementById("configTiempoSalida").value);

    if (!Number.isFinite(tiempo) || tiempo < 0) {
      mostrarNotificacion(
        "Ingrese un tiempo mínimo de salida válido.",
        "error"
      );
      return;
    }

    const ingresoManana = document.getElementById("configIngresoManana").value.trim();
    const cierreManana = document.getElementById("configCierreManana").value.trim();
    const ingresoTarde = document.getElementById("configIngresoTarde").value.trim();
    const cierreTarde = document.getElementById("configCierreTarde").value.trim();
    const ingresoNoche = document.getElementById("configIngresoNoche").value.trim();
    const cierreNoche = document.getElementById("configCierreNoche").value.trim();

    const esHora = v => /^\d{2}:\d{2}$/.test(v);
    if (!esHora(ingresoManana) || !esHora(cierreManana) || !esHora(ingresoTarde) || !esHora(cierreTarde) || !esHora(ingresoNoche) || !esHora(cierreNoche)) {
      mostrarNotificacion(
        "Ingrese horas válidas HH:MM para los 3 turnos.",
        "error"
      );
      return;
    }

    const configuraciones = {
      TIEMPO_MINIMO_SALIDA: Math.floor(tiempo),
      HORA_INGRESO_MANANA: ingresoManana,
      HORA_CIERRE_MANANA: cierreManana,
      HORA_INGRESO_TARDE: ingresoTarde,
      HORA_CIERRE_TARDE: cierreTarde,
      HORA_INGRESO_NOCHE: ingresoNoche,
      HORA_CIERRE_NOCHE: cierreNoche,
      PERMITIR_REGISTRO_MANUAL: document.getElementById("configPermitirManual").checked,
      PERMITIR_REGISTRO_SCANNER: document.getElementById("configPermitirScanner").checked,
      BLOQUEAR_DUPLICADO_DIARIO: document.getElementById("configBloquearDuplicado").checked,
      EXIGIR_ENTRADA_PREVIA_SALIDA: document.getElementById("configEntradaPrevia").checked,
      BLOQUEAR_SALIDA_PERSONAL_INACTIVO: document.getElementById("configBloquearSalidaInactivo").checked,
      PERMITIR_ENTRADA_PERSONAL_INACTIVO: document.getElementById("configEntradaInactivo").checked,
      MOSTRAR_FOTO_PERSONAL: document.getElementById("configMostrarFoto").checked,
      MOSTRAR_QR_REGISTRO_ALUMNO: document.getElementById("configMostrarQR").checked,
      URL_FORMULARIO_REGISTRO_ALUMNO: document.getElementById("configUrlFormulario").value.trim(),
      NOMBRE_INSTITUCION: document.getElementById("configNombreInstitucion").value.trim()
    };

    const subirRecurso = (input, tipo) => {
      if (!input.files || !input.files[0]) {
        return Promise.resolve(null);
      }

      const archivo = input.files[0];

      if (!["image/jpeg", "image/png", "image/webp"].includes(archivo.type)) {
        return Promise.reject(
          new Error("Solo se permiten imágenes JPG, PNG o WEBP.")
        );
      }

      if (archivo.size > 5 * 1024 * 1024) {
        return Promise.reject(
          new Error("La imagen no puede superar los 5 MB.")
        );
      }

      return new Promise((resolve, reject) => {
        const lector = new FileReader();

        lector.onload = () => {
          google.script.run
            .withSuccessHandler(resultado => {
              if (resultado && resultado.estado === "GUARDADO") {
                resolve(resultado.id);
                return;
              }

              reject(
                new Error(
                  resultado?.mensaje || "No se pudo guardar el recurso."
                )
              );
            })
            .withFailureHandler(error => {
              console.error(error);
              reject(
                new Error("Ocurrió un error al guardar la imagen.")
              );
            })
            .guardarRecursoInstitucional({
              token,
              tipo,
              nombre: archivo.name,
              contenido: lector.result,
              mimeType: archivo.type
            });
        };

        lector.onerror = () => {
          reject(
            new Error("No se pudo leer la imagen seleccionada.")
          );
        };

        lector.readAsDataURL(archivo);
      });
    };

    cambiarEstadoBoton(
      btn,
      true,
      "hourglass_top",
      "Guardando..."
    );

    Promise.all([
      subirRecurso(inputLogo, "LOGO_INSTITUCIONAL"),
      subirRecurso(inputFondo, "IMAGEN_FONDO_ASISTENCIA")
    ])
      .then(([logoId, fondoId]) => {
        if (logoId) {
          configuraciones.LOGO_INSTITUCIONAL = logoId;
        }

        if (fondoId) {
          configuraciones.IMAGEN_FONDO_ASISTENCIA = fondoId;
        }

        google.script.run
          .withSuccessHandler(resultado => {
            cambiarEstadoBoton(
              btn,
              false,
              "save",
              "Guardar cambios"
            );

            if (manejarRespuestaAutorizacion(resultado)) return;

            if (resultado && resultado.estado === "GUARDADO") {
              inputLogo.value = "";
              inputFondo.value = "";

              mostrarNotificacion(
                resultado.mensaje,
                "exito"
              );
              return;
            }

            mostrarNotificacion(
              resultado?.mensaje || "No se pudo guardar la configuración.",
              "error"
            );
          })
          .withFailureHandler(error => {
            console.error(error);

            cambiarEstadoBoton(
              btn,
              false,
              "save",
              "Guardar cambios"
            );

            mostrarNotificacion(
              "Ocurrió un error al guardar la configuración.",
              "error"
            );
          })
          .guardarConfiguracionesSistema({
            token,
            configuraciones
          });
      })
      .catch(error => {
        cambiarEstadoBoton(
          btn,
          false,
          "save",
          "Guardar cambios"
        );

        mostrarNotificacion(
          error.message || "No se pudo guardar el recurso.",
          "error"
        );
      });
  }

  configurarOpcionMenu(menuConfiguracion, mostrarConfiguracion);
</script>
