<style>
    @import url("https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        height: 100dvh;
        width: 100%;
        overflow: hidden;
        background: #fff;
    }

    .contenedor {
        font-family: "Barlow", sans-serif;
        display: grid;
        grid-template:
            "nav header" 60px
            "nav main" 1fr/
            200px auto;
        height: 100dvh;
        width: 100%;
    }

    .contenedor header {
        grid-area: header;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        padding: 0 32px;
        border-bottom: 1px solid #00000015;
        height: 60px;
        background: rgba(255, 255, 255, .88);
        backdrop-filter: blur(6px);
        z-index: 2;
    }

    .contenedor header h1 {
        font-size: 1.3rem;
        color: #292929;
        margin: 0;
    }

    .contenedor nav {
        grid-area: nav;
        background: #2f5ba9;
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    .contenedor nav img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        display: block;
        margin: 20px auto;
        background: #fff;
        border-radius: 50%;
        padding: 5px;
    }

    .contenedor nav .barras {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    .contenedor nav section {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .contenedor nav section:last-of-type {
        margin-top: auto;
        margin-bottom: 20px;
    }

    .contenedor nav section a {
        text-decoration: none;
        color: #fff;
        padding: 10px 20px;
        transition: .2s ease;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .contenedor nav section a:hover {
        color: #2f5ba9;
        background: #fff;
        font-weight: 600;
    }

    .contenedor main {
        grid-area: main;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        padding: 20px;
        height: 100%;
        background: #fff;
    }

    .contenedor main>img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: .3;
        width: 100%;
        height: 100%;
        max-height: 100%;
        object-fit: cover;
        border-radius: 12px;
        pointer-events: none;
    }

    .marcarAsistencia {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        justify-content: center;
        z-index: 1;
    }

    .marcarAsistencia h1 {
        font-size: 7.5rem;
        margin: 0;
        line-height: 1;
    }

    .marcarAsistencia h2 {
        font-size: 2rem;
        margin-top: 5px;
    }

    .marcarAsistencia p {
        margin-top: 25px;
    }

    .marcarAsistencia input {
        padding: 10px;
        border-radius: 10px;
        background: #f7f7f7;
        text-align: center;
        color: #000;
        border: 1px solid #2f5ba9;
        outline: none;
        font-size: .7rem;
        margin-top: 10px;
    }

    .marcarAsistencia button {
        padding: 10px 30px;
        background: #2f5ba9;
        color: #fff;
        font-size: .7rem;
        border: none;
        border-radius: 10px;
        margin-top: 15px;
        cursor: pointer;
    }

    .contenedor dialog {
        border: none;
        border-radius: 12px;
        padding: 30px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
        width: 90%;
        max-width: 450px;
        text-align: center;
        box-sizing: border-box;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
    }

    dialog#modalLogin,
    dialog#modalMensaje {
        position: fixed !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        margin: 0 !important;
    }

    .dlg {
        border: none;
        border-radius: 12px;
        padding: 30px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
        width: 90%;
        max-width: 450px;
        text-align: center;
        box-sizing: border-box;
    }

    .dlg-titulo {
        font-family: sans-serif;
        color: #0c436b;
        font-size: 1.6rem;
        margin: 10px 0 20px;
    }

    .dlg-estado {
        font-family: sans-serif;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 10px 0 20px;
    }

    .contenedor dialog p {
        font-family: sans-serif;
        color: #555;
        margin-bottom: 20px;
        font-weight: bold;
    }

    .contenedor dialog::backdrop {
        background: rgba(10, 37, 64, .55);
        backdrop-filter: blur(4px);
    }

    .contenedor dialog h1 {
        font-family: sans-serif;
        color: #0c436b;
        font-size: 1.6rem;
        margin: 10px 0 20px;
    }

    #formRegManual {
        display: flex;
        flex-direction: column;
        gap: 15px;
        align-items: stretch;
    }

    #formRegManual label {
        font-family: sans-serif;
        color: #555;
        font-weight: bold;
        text-align: left;
        font-size: .95rem;
    }

    #formRegManual input {
        padding: 12px 15px;
        border: 2px solid #ccc;
        border-radius: 6px;
        font-size: 1.1rem;
        outline: none;
        transition: border-color .2s ease;
    }

    #formRegManual input:focus {
        border-color: #0c436b;
    }

    .btnguardar {
        background: #0c436b;
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background .2s;
    }

    .btnguardar:hover {
        background: #072a44;
    }

    #modalMensaje .icono {
        font-size: 4rem;
        margin-bottom: 10px;
    }

    #modalMensaje h4 {
        font-family: sans-serif;
        color: #28a745;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 10px 0 20px;
    }

    .x {
        position: absolute;
        top: 12px;
        right: 12px;
        background: #f0f2f5;
        border: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        font-size: 1rem;
        font-weight: bold;
        color: #666;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .2s, color .2s;
    }

    .x:hover {
        background: #e4e6eb;
        color: #000;
    }

    #contenedorQr {
        display: none;
        text-align: center;
        margin-top: 15px;
    }

    #contenedorQr p {
        margin: 10px 0 15px;
        font-family: sans-serif;
        color: #555;
        font-weight: bold;
    }

    #qrFormulario {
        width: 220px;
        height: 220px;
        margin: 15px auto 5px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #qrFormulario img,
    #qrFormulario canvas {
        position: static !important;
        top: auto !important;
        left: auto !important;
        transform: none !important;
        opacity: 1 !important;
        width: 220px !important;
        height: 220px !important;
        max-width: 220px !important;
        max-height: 220px !important;
        display: block;
        margin: 0 auto;
        pointer-events: auto;
    }

    #fotoPersonal {
        display: none;
        width: 150px !important;
        height: 150px !important;
        object-fit: cover;
        border-radius: 50%;
        margin: 15px auto;
        position: static !important;
        top: auto !important;
        left: auto !important;
        transform: none !important;
        opacity: 1 !important;
        max-width: 150px !important;
        max-height: 150px !important;
        z-index: 10;
    }

    #modalLogin {
        width: 380px;
        max-width: calc(100vw - 30px);
        padding: 32px;
        border: none;
        border-radius: 18px;
        text-align: center;
        background: #fff;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .22);
    }

    #modalLogin::backdrop {
        background: rgba(15, 23, 42, .48);
        backdrop-filter: blur(5px);
    }

    #modalLogin .iconoLogin {
        font-size: 4.2rem;
        color: #2f5ba9;
        margin-bottom: 8px;
    }

    #modalLogin h2 {
        margin: 0 0 26px;
        color: #171717;
        font-size: 1.55rem;
    }

    #modalLogin label {
        display: block;
        text-align: left;
        margin: 14px 0 7px;
        font-weight: 600;
        color: #252525;
    }

    #modalLogin input {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #d4d8df;
        border-radius: 8px;
        font-family: inherit;
        font-size: 1rem;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
    }

    #modalLogin input:focus {
        border-color: #2f5ba9;
        box-shadow: 0 0 0 3px rgba(47, 91, 169, .1);
    }

    .accionesLogin {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 27px;
    }

    .accionesLogin button {
        border: none;
        border-radius: 8px;
        padding: 11px 20px;
        cursor: pointer;
        font-family: inherit;
        font-size: .95rem;
        transition: .2s ease;
    }

    #btnIniciarSesion {
        background: #2f5ba9;
        color: #fff;
    }

    #btnIniciarSesion:hover {
        background: #264d91;
        transform: translateY(-1px);
    }

    #btnCancelarLogin {
        background: #eef0f3;
        color: #333;
    }

    #btnCancelarLogin:hover {
        background: #e1e4e8;
    }

    /* ADMINISTRACION */

    .contenedorAdmin {
        display: flex;
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
        overflow: hidden;
        font-family: "Barlow", sans-serif;
        background: #f4f6f9;
        color: #20242a;
    }

    .menuAdmin {
        width: 235px;
        min-width: 235px;
        height: 100%;
        background: #2f5ba9;
        color: #fff;
        display: flex;
        flex-direction: column;
        box-shadow: 4px 0 18px rgba(25, 45, 80, .08);
        z-index: 20;
    }

    .cabeceraAdmin {
        padding: 28px 20px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid rgba(255, 255, 255, .12);
    }

    .cabeceraAdmin .material-symbols-outlined {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 58px;
        height: 58px;
        border-radius: 16px;
        background: rgba(255, 255, 255, .13);
        font-size: 32px;
    }

    .cabeceraAdmin h2 {
        margin: 13px 0 0;
        font-size: 1.18rem;
        font-weight: 600;
        letter-spacing: .2px;
    }

    .menuAdmin nav {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 20px 12px;
    }

    .menuAdmin nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 45px;
        padding: 11px 14px;
        border-radius: 9px;
        color: rgba(255, 255, 255, .88);
        text-decoration: none;
        font-size: .96rem;
        font-weight: 500;
        transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .menuAdmin nav a .material-symbols-outlined {
        font-size: 21px;
        flex-shrink: 0;
    }

    .menuAdmin nav a:hover {
        background: rgba(255, 255, 255, .12);
        color: #fff;
    }

    .menuAdmin nav a.menuActivo {
        background: #fff;
        color: #2f5ba9;
        font-weight: 650;
        box-shadow: 0 5px 14px rgba(15, 35, 70, .13);
    }

    .menuAdmin nav a.menuActivo .material-symbols-outlined {
        color: #2f5ba9;
    }

    .zonaCerrarSesion {
        margin-top: auto;
        padding: 18px 12px 20px;
        border-top: 1px solid rgba(255, 255, 255, .12);
    }

    #btnCerrarSesion {
        width: 100%;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 9px;
        cursor: pointer;
        background: rgba(255, 255, 255, .08);
        color: #fff;
        font-family: inherit;
        font-size: .92rem;
        transition: background .2s ease, border-color .2s ease;
    }

    #btnCerrarSesion:hover {
        background: rgba(255, 255, 255, .16);
        border-color: rgba(255, 255, 255, .35);
    }

    #btnCerrarSesion .material-symbols-outlined {
        font-size: 20px;
    }

    .contenidoAdmin {
        flex: 1;
        min-width: 0;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 32px 36px 40px;
        background: #f4f6f9;
    }

    .cabeceraContenido {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
    }

    .cabeceraContenido h1 {
        margin: 0;
        color: #171b21;
        font-size: 1.65rem;
        font-weight: 650;
        line-height: 1.2;
    }

    .cabeceraContenido p {
        margin-top: 6px;
        color: #737b87;
        font-size: .94rem;
    }

    #contenidoPrincipal {
        width: 100%;
        min-height: calc(100% - 90px);
        background: #fff;
        padding: 28px;
        border: 1px solid #e5e8ed;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(30, 45, 70, .045);
    }

    #contenidoPrincipal h2 {
        margin: 0;
        color: #1d232b;
        font-size: 1.35rem;
    }

    #contenidoPrincipal>p {
        color: #707783;
        margin-top: 7px;
    }

    /* MODULOS */

    .encabezadoModulo {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
    }

    .encabezadoModulo>div:first-child h2 {
        margin: 0;
        font-size: 1.35rem;
        color: #1d232b;
    }

    .encabezadoModulo>div:first-child p {
        margin-top: 5px;
        color: #747c87;
        font-size: .91rem;
    }

    .encabezadoModulo>div:last-child {
        display: flex;
        align-items: center;
        gap: 9px;
    }

    /* BOTONES */

    #btnNuevoAlumno,
    #btnAprobacionesPendientes,
    #btnNuevoPersonal,
    #btnNuevoUsuario,
    #btnImportarAlumnos {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 40px;
        padding: 9px 15px;
        border: none;
        border-radius: 8px;
        background: #2f5ba9;
        color: #fff;
        font-family: inherit;
        font-size: .9rem;
        font-weight: 550;
        cursor: pointer;
        box-shadow: 0 3px 8px rgba(47, 91, 169, .16);
        transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    #btnNuevoAlumno:hover,
    #btnAprobacionesPendientes:hover,
    #btnImportarAlumnos:hover #btnNuevoPersonal:hover,
    #btnNuevoUsuario:hover {
        background: #284f96;
        transform: translateY(-1px);
        box-shadow: 0 5px 12px rgba(47, 91, 169, .2);
    }

    #btnEliminarAlumno,
    #btnEliminarPersonal {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 40px;
        padding: 9px 14px;
        border: 1px solid #edcaca;
        border-radius: 8px;
        background: #fff;
        color: #c74747;
        font-family: inherit;
        font-size: .9rem;
        font-weight: 550;
        cursor: pointer;
        transition: background .2s ease, border-color .2s ease, color .2s ease;
    }

    #btnEliminarAlumno:hover:not(:disabled),
    #btnEliminarPersonal:hover:not(:disabled) {
        background: #fff2f2;
        border-color: #e4aaaa;
    }

    #btnEliminarAlumno:disabled,
    #btnEliminarPersonal:disabled {
        opacity: .45;
        cursor: not-allowed;
    }

    .btnAccionAlumno {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid #dfe3e8;
        border-radius: 7px;
        background: #fff;
        color: #4d5662;
        cursor: pointer;
        transition: background .18s ease, border-color .18s ease, color .18s ease;
    }

    .btnAccionAlumno:hover {
        background: #eef4ff;
        border-color: #b9cae8;
        color: #2f5ba9;
    }

    .btnAccionAlumno .material-symbols-outlined {
        font-size: 19px;
    }

    /* BUSCADORES */

    .buscadorAlumnos {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        width: 100%;
    }

    .buscadorAlumnos input {
        flex: 1;
        width: auto;
        min-width: 0;
        height: 42px;
        padding: 10px 14px;
        border: 1px solid #d6d9df;
        border-radius: 8px;
        font-size: .95rem;
        font-family: inherit;
        background: #fff;
        color: #292929;
        box-sizing: border-box;
    }

    .buscadorAlumnos input:focus {
        outline: none;
        border-color: #2f5ba9;
        box-shadow: 0 0 0 3px rgba(47, 91, 169, .1);
    }

    .buscadorAlumnos button {
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 18px;
        border: 1px solid #2f5ba9;
        border-radius: 8px;
        background: #2f5ba9;
        color: #fff;
        font-family: inherit;
        font-size: .9rem;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: background .15s ease, box-shadow .15s ease;
    }

    .buscadorAlumnos button:hover {
        background: #264d91;
        box-shadow: 0 3px 8px rgba(47, 91, 169, .18);
    }

    .buscadorAlumnos button:active {
        transform: translateY(1px);
    }

    @media(max-width:600px) {
        .buscadorAlumnos {
            flex-wrap: wrap;
        }

        .buscadorAlumnos input {
            width: 100%;
            flex-basis: 100%;
        }

        .buscadorAlumnos button {
            width: 100%;
        }
    }

    /* TABLAS */

    .tablaAlumnos {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        border: 1px solid #e3e7ec;
        border-radius: 10px;
        background: #fff;
    }

    .tablaAlumnos thead {
        background: #f7f8fa;
    }

    .tablaAlumnos th {
        padding: 13px 15px;
        text-align: left;
        font-size: .8rem;
        font-weight: 650;
        color: #616975;
        text-transform: uppercase;
        letter-spacing: .35px;
        border-bottom: 1px solid #e3e7ec;
    }

    .tablaAlumnos td {
        padding: 13px 15px;
        border-bottom: 1px solid #edf0f3;
        font-size: .9rem;
        color: #363c45;
        vertical-align: middle;
    }

    .tablaAlumnos tbody tr {
        cursor: pointer;
        transition: background .15s ease, box-shadow .15s ease;
    }

    .tablaAlumnos tbody tr:hover {
        background: #f8faff;
    }

    .tablaAlumnos tbody tr:last-child td {
        border-bottom: none;
    }

    .tablaAlumnos tbody tr.filaAlumnoSeleccionada {
        background: #eef4ff;
        box-shadow: inset 3px 0 0 #2f5ba9;
    }

    .tablaAlumnos tbody tr.filaAlumnoSeleccionada td {
        color: #21457f;
    }

    .tablaAlumnos td .material-symbols-outlined {
        vertical-align: middle;
    }

    /* ESTADOS */

    .estadoActivo,
    .estadoInactivo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 78px;
        padding: 5px 9px;
        border-radius: 999px;
        font-size: .76rem;
        font-weight: 650;
        letter-spacing: .2px;
    }

    .estadoActivo {
        background: #eaf7ef;
        color: #277344;
    }

    .estadoInactivo {
        background: #f3f4f6;
        color: #6d737c;
    }

    /* FORMULARIOS */

    .formularioAlumno,
    .formularioPersonal,
    .formularioUsuario {
        display: grid;
        gap: 17px;
    }

    .campoAlumno,
    .campoPersonal,
    .campoUsuario {
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .campoAlumno label,
    .campoPersonal label,
    .campoUsuario label {
        font-size: .88rem;
        font-weight: 600;
        color: #343a42;
    }

    .campoAlumno input,
    .campoAlumno select,
    .campoPersonal input,
    .campoPersonal select,
    .campoUsuario input,
    .campoUsuario select {
        width: 100%;
        min-height: 43px;
        padding: 10px 12px;
        border: 1px solid #d5d9df;
        border-radius: 8px;
        background: #fff;
        color: #242931;
        font-family: inherit;
        font-size: .94rem;
        outline: none;
        transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .campoAlumno input:focus,
    .campoAlumno select:focus,
    .campoPersonal input:focus,
